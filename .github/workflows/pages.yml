name: Finance quality and deployment
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finances-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned tools
        run: npm ci --ignore-scripts
      - name: Audit known dependency vulnerabilities
        run: npm run audit
      - name: Check new commit messages
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node tools/check-commits.cjs "$PR_BASE" "$PR_HEAD"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            node tools/check-commits.cjs "$PUSH_BASE" "$GITHUB_SHA"
          else
            BASE=$(git merge-base origin/main HEAD)
            node tools/check-commits.cjs "$BASE" "$GITHUB_SHA"
          fi
      - name: Build installer and PWA cache version
        run: npm run build
      - name: Check formatting with Prettier
        run: npm run format:check
      - name: Check code with ESLint
        run: npm run lint
      - name: Test business rules, channel, and recovery
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile browsers
        run: npm run test:browser
      - name: Record quality results
        if: always()
        run: |
          node tools/quality-summary.cjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-tests
          path: |
            playwright-report/
            test-results/
            quality-results/
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./web
      - name: Publish verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
