name: Comprobar y publicar Finanzas

on:
  push:
    branches: [main]
    paths: ['web/**', 'apps-script/**', 'tests/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Preparar código copiable de Google
        run: node tools/build-install.cjs
      - name: Comprobar conexión y cálculos
        run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
