name: Bug report
description: Describe a reproducible issue without sharing financial data.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Use fictional data. Do not publish balances, real transactions, email addresses, workbook identifiers, private Google links, or complete execution logs.
        For potential vulnerabilities, read [SECURITY.md](https://github.com/manuuelmarin/finances/blob/main/SECURITY.md) and use a private reporting channel.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Include the app and Apps Script versions if known; the API and release have separate version identifiers.
      placeholder: App 3.8.1 · Google 3.8.1 · API 3.3.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Google connection
        - Transactions and operations
        - Investments and prices
        - Charts and tables
        - Budgets, salary, or goals
        - Installation or local storage
        - Documentation or developer tools
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include specific actions and the error message, with private data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on desktop · Safari on phone
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I used fictional data and removed private information from this report.
          required: true
