name: Informar de un error
description: Describe un fallo reproducible sin compartir datos financieros.
title: '[Error]: '
body:
  - type: markdown
    attributes:
      value: |
        Usa datos ficticios. No publiques saldos, movimientos reales, correos, identificadores de libros, enlaces privados de Google ni registros completos de ejecución.
        Para posibles vulnerabilidades, consulta [SECURITY.md](https://github.com/manuuelmarin/finances/blob/main/SECURITY.md) y utiliza un canal privado.
  - type: input
    id: version
    attributes:
      label: Versiones
      description: Indica la versión de la app y de Apps Script si las conoces; API y entrega son identificadores distintos.
      placeholder: App 3.8.1 · Google 3.8.1 · API 3.3.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Componente
      options:
        - Conexión con Google
        - Movimientos y operaciones
        - Inversiones y cotizaciones
        - Gráficos y tablas
        - Presupuestos, salario u objetivos
        - Instalación o almacenamiento local
        - Documentación o herramientas de desarrollo
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Incluye acciones concretas y el mensaje de error, con los datos privados eliminados.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado observado
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome en ordenador · Safari en teléfono
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He usado datos ficticios y he retirado la información privada del informe.
          required: true
