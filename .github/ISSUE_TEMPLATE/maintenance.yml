name: Maintenance proposal
description: Documentation, formatting, tests, or repository cleanup.
title: '[Maintenance]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Specific problem
      description: Explain what is confusing or difficult to maintain and identify the relevant files.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the result and how to verify it; identify any effect on app behavior.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This proposal contains no financial data, workbook identifiers, or private links.
          required: true
