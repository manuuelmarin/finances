<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <style>
      body {
        font:
          17px/1.6 system-ui,
          sans-serif;
        margin: 0;
        background: #101b21;
        color: #e8f1ef;
      }
      main {
        max-width: 440px;
        margin: 70px auto;
        padding: 24px;
      }
      h1 {
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Finanzas · Conexión</h1>
      <p id="status" role="status">Comprobando la lectura…</p>
      <p id="detail">Puedes volver a la página de Finanzas al terminar.</p>
      <a
        id="return-to-app"
        href="https://manuuelmarin.github.io/finances/#connection"
        target="_blank"
        rel="noopener noreferrer"
        style="color: #b6e5ba"
        >Volver a Finanzas</a
      >
    </main>
    <!-- Impresión con escape contextual: no insertar JSON sin escape en un script. -->
    <div id="payload" hidden><?= payloadJson ?></div>
    <div id="origin" hidden><?= appOrigin ?></div>
    <script>
      'use strict';
      const payload = JSON.parse(
        document.getElementById('payload').textContent,
      );
      const appOrigin = document.getElementById('origin').textContent;
      const status = document.getElementById('status');
      const detail = document.getElementById('detail');
      const BRIDGE_VERSION = '3.6.0';
      const API_TRANSPORT = 'finances.rpc.json.v1';
      const errors = {
        INVALID_REQUEST:
          'Abre Finanzas y pulsa Comprobar conexión. Abrir este enlace directamente no inicia la prueba.',
        NOT_CONFIGURED:
          'Revisa OWNER_EMAIL, ENVIRONMENT y el identificador del libro seleccionado en las propiedades del script.',
        ACCESS_DENIED:
          'Accede con la cuenta propietaria configurada en el proyecto.',
        INVALID_MODEL:
          'Revisa el libro conectado: deben estar las diez pestañas y las doce tablas del modelo 3.',
        READ_FAILED:
          'Revisa el servicio avanzado Sheets, los permisos y el acceso al libro conectado.',
        UPDATE_REQUIRED:
          'Actualiza Code.gs y Bridge.html desde el instalador y publica Nueva versión de la implementación existente.',
        TRANSPORT_UNAVAILABLE:
          'Google no ha iniciado el canal privado. Vuelve a abrir el libro con la sesión de Google iniciada.',
        TRANSPORT_TIMEOUT:
          'Google no ha respondido a la prueba del canal. Vuelve a abrir el libro; si persiste, revisa la implementación privada.',
        INVALID_RESPONSE:
          'La implementación no devuelve el formato vigente. Actualiza los tres archivos y publica Nueva versión.',
      };
      let apiReceiver;
      let ready = false;
      try {
        apiReceiver = window.top.opener;
      } catch (error) {}
      document
        .getElementById('return-to-app')
        .addEventListener('click', (event) => {
          if (!apiReceiver) return;
          event.preventDefault();
          apiReceiver.focus();
        });
      const send = (message) => {
        try {
          if (apiReceiver) apiReceiver.postMessage(message, appOrigin);
        } catch (error) {
          status.textContent = 'Vuelve a abrir el libro desde Finanzas.';
        }
      };
      const connected = (error) => {
        ready = !error;
        const readOnly = Boolean(
          payload.snapshot &&
          [
            'TRANSPORT_UNAVAILABLE',
            'TRANSPORT_TIMEOUT',
            'INVALID_RESPONSE',
          ].includes(error),
        );
        status.textContent = readOnly
          ? 'Datos leídos · canal de operaciones pendiente.'
          : error
            ? 'La conexión necesita revisión.'
            : payload.snapshot
              ? 'Datos del libro leídos.'
              : 'Estructura y canal privado comprobados.';
        detail.textContent = error
          ? errors[error] || errors.READ_FAILED
          : 'Mantén esta ventana abierta para leer cambios y confirmar operaciones desde Finanzas.';
        if (!apiReceiver)
          detail.textContent +=
            ' Vuelve a Finanzas y abre el libro de nuevo con esta sesión de Google iniciada.';
        send({
          ...payload,
          ok: !error || readOnly,
          ...(error && !readOnly ? { error, snapshot: undefined } : {}),
          ...(readOnly ? { readOnly: true, transportError: error } : {}),
          bridgeVersion: BRIDGE_VERSION,
          apiTransport: API_TRANSPORT,
          rpcReady: ready,
        });
      };
      const parse = (raw) => {
        if (typeof raw !== 'string') throw Error('INVALID_RESPONSE');
        const result = JSON.parse(raw);
        if (!result || typeof result.ok !== 'boolean')
          throw Error('INVALID_RESPONSE');
        return result;
      };
      // Registrar el receptor antes de anunciar que el canal está listo.
      if (payload.ok && apiReceiver)
        window.addEventListener('message', (event) => {
          if (
            event.origin !== appOrigin ||
            event.source !== apiReceiver ||
            !event.data ||
            typeof event.data !== 'object'
          )
            return;
          const message = event.data;
          if (
            message.type !== 'finances.api.request.v1' ||
            message.state !== payload.state ||
            typeof message.callId !== 'string' ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
              message.callId,
            ) ||
            !message.request ||
            typeof message.request !== 'object' ||
            JSON.stringify(message.request).length > 60000
          )
            return;
          const reply = (result) =>
            send({
              type: 'finances.api.response.v1',
              state: payload.state,
              callId: message.callId,
              result,
            });
          if (!ready) {
            reply({ ok: false, error: 'NOT_READY' });
            return;
          }
          const writing = ['transact', 'refreshPrices'].includes(
            message.request.action,
          );
          const fail = () =>
            reply({
              ok: false,
              error: writing ? 'RESPONSE_UNCERTAIN' : 'READ_CHANNEL_FAILED',
              message: writing
                ? 'Envío sin confirmar. Se conserva la solicitud para consultar su recibo, sin duplicarla.'
                : 'Google no ha completado la lectura. Vuelve a abrir el libro; no se ha enviado ninguna operación.',
            });
          send({
            type: 'finances.api.progress.v1',
            state: payload.state,
            callId: message.callId,
            phase: 'received',
          });
          status.textContent = writing
            ? 'Confirmando la operación…'
            : 'Leyendo el libro…';
          try {
            google.script.run
              .withSuccessHandler((raw) => {
                try {
                  const result = parse(raw);
                  status.textContent = result.ok
                    ? 'Respuesta enviada a Finanzas.'
                    : 'La solicitud necesita revisión.';
                  reply(result);
                } catch (error) {
                  fail();
                }
              })
              .withFailureHandler(fail)
              .financialApiJson(JSON.stringify(message.request));
          } catch (error) {
            fail();
          }
        });
      // Google inicializa su runner dentro del iframe. No basta con tener HTML.
      function start() {
        if (!payload.ok) {
          connected(payload.error);
          return;
        }
        if (payload.buildVersion !== BRIDGE_VERSION) {
          connected('UPDATE_REQUIRED');
          return;
        }
        status.textContent = 'Comprobando el canal privado de Google…';
        detail.textContent =
          'La estructura está leída; falta confirmar la comunicación de las operaciones.';
        const deadline = Date.now() + 10000;
        const waitRunner = () => {
          if (
            typeof google === 'undefined' ||
            !google.script?.run?.withSuccessHandler
          ) {
            if (Date.now() < deadline) setTimeout(waitRunner, 100);
            else connected('TRANSPORT_UNAVAILABLE');
            return;
          }
          let done = false;
          const finish = (error) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            connected(error);
          };
          const timer = setTimeout(() => finish('TRANSPORT_TIMEOUT'), 30000);
          try {
            google.script.run
              .withSuccessHandler((raw) => {
                try {
                  const result = parse(raw);
                  finish(
                    !result.ok
                      ? result.error || 'INVALID_RESPONSE'
                      : result.buildVersion !== BRIDGE_VERSION ||
                          result.apiTransport !== API_TRANSPORT
                        ? 'UPDATE_REQUIRED'
                        : null,
                  );
                } catch (error) {
                  finish('INVALID_RESPONSE');
                }
              })
              .withFailureHandler(() => finish('TRANSPORT_UNAVAILABLE'))
              .financialApiJson('{"action":"ping"}');
          } catch (error) {
            finish('TRANSPORT_UNAVAILABLE');
          }
        };
        waitRunner();
      }
      start();
    </script>
  </body>
</html>
